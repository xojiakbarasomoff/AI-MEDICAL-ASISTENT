repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict]
        files: ^app/
        additional_dependencies:
          - fastapi>=0.115
          - pydantic>=2.9
          - pydantic-settings>=2.5
          - sqlalchemy>=2.0
          - pgvector>=0.3
          - openai>=1.50
